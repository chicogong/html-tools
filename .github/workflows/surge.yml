name: Deploy to Surge

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    # Surge is optional. Enable only after login, token and domain are all configured.
    if: github.ref == 'refs/heads/master' && vars.SURGE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: surge-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SSG
        run: npm run build

      - name: Install Surge
        run: npm install --global surge@0.43.0

      - name: Deploy to Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_DOMAIN: ${{ secrets.SURGE_DOMAIN }}
        run: |
          if [ -z "${SURGE_LOGIN:-}" ] || [ -z "${SURGE_TOKEN:-}" ] || [ -z "${SURGE_DOMAIN:-}" ]; then
            echo "::error::Required Surge deployment secrets are not configured"
            exit 1
          fi
          surge ./dist "$SURGE_DOMAIN"
