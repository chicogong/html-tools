name: Deploy to Surge

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SSG
        run: npm run build

      - name: Install Surge
        run: npm install -g surge

      - name: Deploy to Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_DOMAIN: ${{ secrets.SURGE_DOMAIN }}
        run: |
          if [ -z "${SURGE_LOGIN:-}" ] || [ -z "${SURGE_TOKEN:-}" ] || [ -z "${SURGE_DOMAIN:-}" ]; then
            echo "::error::Required Surge deployment secrets are not configured"
            exit 1
          fi
          surge ./dist "$SURGE_DOMAIN"
