version: 2
updates:
  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      trusted-actions:
        patterns:
          - 'actions/*'
          - 'cloudflare/wrangler-action'
          - 'softprops/action-gh-release'
        update-types:
          - 'minor'
          - 'patch'
    # Major action upgrades require a deliberate workflow/security review.
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
      - 'npm'
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # Major lint/build upgrades are handled as explicit compatibility work.
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
