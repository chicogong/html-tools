name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GITLEAKS_VERSION: '8.30.1'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag targets current master
        run: |
          git fetch --no-tags origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "::error::Release tags must point to the current origin/master commit"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and version metadata
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: npm run check:version

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install pinned Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --retry 3 --retry-all-errors --fail --silent --show-error --location "$base_url/$archive" --output "/tmp/$archive"
          curl --retry 3 --retry-all-errors --fail --silent --show-error --location "$base_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output /tmp/gitleaks-checksums.txt
          (cd /tmp && grep " $archive$" gitleaks-checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/$archive" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run redacted tracked-history secret scan
        run: npm run audit:secrets

      - name: Scan tracked personal paths
        run: npm run audit:personal-paths

      - name: Build SSG
        run: npm run build

      - name: Verify generated sources are committed
        run: git diff --exit-code -- index.html README.md sitemap.xml manifest.json llms.txt i18n tools

      - name: Scan release tree and verify license files
        run: |
          gitleaks dir dist --redact=100 --no-banner
          npm run check:artifact-license

      - name: Create release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:release

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -20)
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Count tools
        id: tools
        run: |
          TOOL_COUNT=$(jq '.tools | length' tools.json)
          echo "COUNT=$TOOL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOOL_COUNT: ${{ steps.tools.outputs.COUNT }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        with:
          name: WebUtils ${{ steps.version.outputs.version }}
          body: |
            ## WebUtils ${{ steps.version.outputs.version }}

            **${{ steps.tools.outputs.COUNT }}+ 纯前端在线工具集**

            ### 特性
            - 静态 HTML 工具集，可导出独立页面
            - 多数格式化、计算和生成工具在浏览器页面本地处理
            - HTTP、REST、WebSocket 等网络工具会连接用户选择或页面标明的第三方服务
            - 离线能力取决于具体工具及其外部资源/API 依赖

            ### 下载
            - `webutils-${{ steps.version.outputs.version }}.zip` - ZIP 压缩包
            - `webutils-${{ steps.version.outputs.version }}.tar.gz` - TAR.GZ 压缩包
            - `SHA256SUMS` - 发布归档校验值

            ### 使用方法
            1. 下载并解压
            2. 用浏览器打开 `index.html`
            3. 按 README 的隐私与网络边界使用；外部资源或网络工具仍需联网

            ### 更新日志
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            [在线文档](https://github.com/chicogong/html-tools#readme) | [在线体验](https://tools.realtime-ai.chat)
          files: |
            webutils-${{ steps.version.outputs.version }}.zip
            webutils-${{ steps.version.outputs.version }}.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
